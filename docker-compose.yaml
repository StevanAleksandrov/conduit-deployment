services:
  database:
    image: postgres:16-alpine
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conduit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_NAMESPACE}/conduit-backend:${IMAGE_TAG}
    env_file:
      - ./.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - conduit_network
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_NAMESPACE}/conduit-frontend:${IMAGE_TAG}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8282}:80"
    networks:
      - conduit_network
    restart: unless-stopped

networks:
  conduit_network:
    driver: bridge

volumes:
  postgres_data: